                    else if (color === 'gray') hasDormant = true;
                    else if (color === 'green') hasOnline = true;
                }

                var clusterColor = 'blue';  // Default color
                if (hasOffline) clusterColor = 'red';
                else if (hasAlerting) clusterColor = 'orange';
                else if (hasDormant) clusterColor = 'gray';
                else if (hasOnline) clusterColor = 'green';

                    className: 'leaflet-div-icon',
                    html: '<div style="background-color:' + clusterColor + '; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px; color: white;">' + markers.length + '</div>'
